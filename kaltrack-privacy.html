<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kal-Track – Privacy</title>
<link rel="icon" href="kaltrack-favicon.svg" />
<style>
  :root { --bg:#f4f6fa; --card:#ffffff; --text:#1e293b; --muted:#64748b; --line:#e2e8f0; --accent:#059669; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155; --accent:#34d399; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  header img { width:56px; height:56px; border-radius:14px; }
  h1 { font-size:1.5rem; margin:0; line-height:1.2; }
  h2 { font-size:1.1rem; margin:28px 0 6px; color:var(--accent); }
  .date { color:var(--muted); font-size:.9rem; margin:0 0 16px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 20px; }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:6px 12px; font:inherit; font-size:.9rem; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:4px 20px 20px; }
  ul { padding-left:20px; margin:6px 0; }
  li { margin:4px 0; }
  a { color:var(--accent); }
  .summary { font-weight:500; }
  html:lang(ko) body { word-break: keep-all; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header><img src="kaltrack-icon-192.png" alt="" /><h1 id="title"></h1></header>
  <p class="date" id="date"></p>
  <nav id="langs" aria-label="Language"></nav>
  <div class="card" id="content"></div>
</main>
<script>
// Adresse de contact affichée dans la politique.
const CONTACT = 'kalapps.contact@gmail.com';

const L = {
fr: { name: 'Français', title: 'Politique de confidentialité', date: 'Dernière mise à jour : 20 novembre 2026', s: [
 ['En bref', '<p class="summary">Kal-Track fonctionne sans compte. Votre profil, vos repas, vos photos et vos pesées restent enregistrés uniquement sur votre téléphone : nous ne les recevons pas, ne les vendons pas et n’affichons aucune publicité. Seules les analyses IA que vous demandez et la recherche par code-barres utilisent internet.</p>'],
 ['Qui sommes-nous', '<p>Kal-Track est éditée par Kal-Apps, développeur indépendant. Contact : <a href="mailto:{c}">{c}</a></p>'],
 ['Données enregistrées sur votre téléphone', '<ul><li>Profil : prénom (facultatif), sexe, âge, taille, poids, niveau d’activité et objectifs.</li><li>Journal : repas, quantités, valeurs nutritionnelles, miniatures des photos, eau, pesées.</li><li>Réglages : langue, unités, thème.</li></ul><p>Ces données sont stockées dans l’espace privé de l’application (ou du navigateur pour la version web). Elles ne sont jamais envoyées à nos serveurs. Vous pouvez les exporter, les importer ou toutes les supprimer dans Réglages → Données. Désinstaller l’application les efface.</p>'],
 ['Analyse par intelligence artificielle', '<p>Uniquement lorsque vous demandez une analyse (photo d’un repas, étiquette ou description) :</p><ul><li>la photo réduite ou le texte est envoyé à notre relais sécurisé (hébergé par Cloudflare), qui le transmet à l’API Google Gemini pour obtenir l’estimation nutritionnelle ;</li><li>notre relais ne conserve ni les photos ni les textes : il compte seulement le nombre d’analyses par jour pour appliquer les limites d’utilisation ;</li><li>Google traite ces contenus selon les conditions payantes de l’API Gemini : ils ne servent pas à entraîner ses modèles et sont conservés brièvement, uniquement pour détecter les abus ;</li><li>votre profil (âge, poids…) n’est jamais envoyé.</li></ul><p>Conseil : photographiez uniquement votre assiette ou l’emballage, sans visage ni document personnel.</p>'],
 ['Identifiant anonyme de l’appareil', '<p>Pour répartir équitablement les analyses gratuites, l’application crée un numéro aléatoire, sans lien avec votre identité, votre compte Google ou votre téléphone. Il est envoyé avec chaque analyse pour compter les analyses du jour. Ces compteurs sont effacés au bout de quelques jours. Le numéro change si vous effacez les données de l’application.</p>'],
 ['Code-barres', '<p>Le numéro du code-barres scanné est envoyé à Open Food Facts (base de données alimentaire ouverte, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) pour retrouver le produit. Aucune autre donnée n’est transmise.</p>'],
 ['Santé Android (Health Connect)', '<p>Uniquement si tu l’actives dans l’application Android, Kal-Track lit dans Santé Android (Health Connect) : le nombre de pas, les séances de sport (type, durée), les calories actives brûlées et le poids mesuré par une balance connectée. Ces données sont uniquement lues (jamais modifiées), restent sur ton téléphone et servent seulement à afficher ton activité, ajuster ton objectif calorique du jour et compléter ta courbe de poids. Elles ne sont jamais envoyées à nos serveurs, ni à l’IA, ni à un tiers, et ne servent pas à la publicité. Tu peux retirer l’accès à tout moment dans les réglages de Santé Android.</p>'],
 ['Appareil photo', '<p>L’appareil photo est utilisé uniquement quand vous prenez une photo ou scannez un code-barres ou une étiquette. Seule une miniature du repas est conservée, sur votre téléphone.</p>'],
 ['Ce que nous ne faisons pas', '<ul><li>Pas de compte ni d’inscription.</li><li>Pas de publicité.</li><li>Pas de statistiques d’usage, de traceurs ou de cookies publicitaires.</li><li>Pas de localisation.</li><li>Aucune vente ni partage de vos données à des fins commerciales.</li></ul>'],
 ['Prestataires', '<ul><li>Cloudflare, Inc. – relais des analyses IA.</li><li>Google LLC – API Gemini (intelligence artificielle).</li><li>Open Food Facts – informations sur les produits.</li><li>GitHub (Microsoft) – téléchargement unique de la police du PDF en japonais, coréen ou chinois (aucune donnée personnelle).</li></ul><p>Ces prestataires peuvent traiter les données hors de l’Union européenne (notamment aux États-Unis), avec les garanties prévues par le RGPD (clauses contractuelles types ou Data Privacy Framework).</p>'],
 ['Âge', '<p>Kal-Track est destinée aux personnes de 18 ans et plus.</p>'],
 ['Santé', '<p>Les estimations de calories et de nutriments sont indicatives et peuvent comporter des erreurs. Elles ne remplacent pas l’avis d’un médecin ou d’un diététicien.</p>'],
 ['Vos droits', '<p>Vos données étant sur votre téléphone, vous les contrôlez entièrement : consultation, export, modification et suppression depuis l’application. Pour toute question sur vos données ou pour exercer vos droits (RGPD), écrivez-nous à <a href="mailto:{c}">{c}</a>. Vous pouvez aussi saisir l’autorité de protection des données de votre pays (en France : la CNIL, <a href="https://www.cnil.fr" target="_blank" rel="noopener">cnil.fr</a>).</p>'],
 ['Modifications', '<p>Cette politique peut évoluer avec l’application. La date de dernière mise à jour figure en haut de la page.</p>'],
]},
en: { name: 'English', title: 'Privacy Policy', date: 'Last updated: November 20, 2026', s: [
 ['In short', '<p class="summary">Kal-Track works without an account. Your profile, meals, photos and weigh-ins are stored only on your phone: we do not receive them, do not sell them and show no ads. Only the AI analyses you request and barcode lookups use the internet.</p>'],
 ['Who we are', '<p>Kal-Track is published by Kal-Apps, an independent developer. Contact: <a href="mailto:{c}">{c}</a></p>'],
 ['Data stored on your phone', '<ul><li>Profile: first name (optional), sex, age, height, weight, activity level and goals.</li><li>Diary: meals, quantities, nutrition values, photo thumbnails, water, weigh-ins.</li><li>Settings: language, units, theme.</li></ul><p>This data is stored in the app’s private storage (or the browser’s for the web version). It is never sent to our servers. You can export, import or delete all of it in Settings → Data. Uninstalling the app erases it.</p>'],
 ['Artificial intelligence analysis', '<p>Only when you request an analysis (meal photo, nutrition label or description):</p><ul><li>the downsized photo or the text is sent to our secure relay (hosted by Cloudflare), which forwards it to the Google Gemini API to get the nutrition estimate;</li><li>our relay does not keep photos or texts: it only counts the number of analyses per day to apply usage limits;</li><li>Google processes this content under the paid Gemini API terms: it is not used to train its models and is kept briefly, only to detect abuse;</li><li>your profile (age, weight…) is never sent.</li></ul><p>Tip: only photograph your plate or the packaging, without faces or personal documents.</p>'],
 ['Anonymous device identifier', '<p>To share the free analyses fairly, the app creates a random number that is not linked to your identity, your Google account or your phone. It is sent with each analysis to count the day’s analyses. These counters are deleted after a few days. The number changes if you clear the app’s data.</p>'],
 ['Barcodes', '<p>The scanned barcode number is sent to Open Food Facts (an open food database, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) to find the product. No other data is sent.</p>'],
 ['Health Connect', '<p>Only if you turn it on in the Android app, Kal-Track reads from Health Connect: step count, workouts (type, duration), active calories burned and the weight measured by a connected scale. This data is read-only (never modified), stays on your phone and is only used to show your activity, adjust today’s calorie goal and complete your weight chart. It is never sent to our servers, to the AI or to any third party, and is never used for advertising. You can revoke access at any time in Health Connect settings.</p>'],
 ['Camera', '<p>The camera is used only when you take a photo or scan a barcode or label. Only a meal thumbnail is kept, on your phone.</p>'],
 ['What we do not do', '<ul><li>No account or sign-up.</li><li>No ads.</li><li>No usage analytics, trackers or advertising cookies.</li><li>No location.</li><li>No selling or sharing of your data for commercial purposes.</li></ul>'],
 ['Service providers', '<ul><li>Cloudflare, Inc. – AI analysis relay.</li><li>Google LLC – Gemini API (artificial intelligence).</li><li>Open Food Facts – product information.</li><li>GitHub (Microsoft) – one-time download of the PDF font for Japanese, Korean or Chinese (no personal data).</li></ul><p>These providers may process data outside the European Union (notably in the United States), with the safeguards required by the GDPR (standard contractual clauses or the Data Privacy Framework).</p>'],
 ['Age', '<p>Kal-Track is intended for people aged 18 and over.</p>'],
 ['Health', '<p>Calorie and nutrient estimates are indicative and may contain errors. They do not replace the advice of a doctor or dietitian.</p>'],
 ['Your rights', '<p>Since your data is on your phone, you are fully in control: view, export, edit and delete it from the app. For any question about your data or to exercise your rights (GDPR), write to us at <a href="mailto:{c}">{c}</a>. You can also contact your country’s data protection authority.</p>'],
 ['Changes', '<p>This policy may change as the app evolves. The last update date is shown at the top of the page.</p>'],
]},
es: { name: 'Español', title: 'Política de privacidad', date: 'Última actualización: 20 de noviembre de 2026', s: [
 ['En resumen', '<p class="summary">Kal-Track funciona sin cuenta. Tu perfil, tus comidas, tus fotos y tus pesajes se guardan solo en tu teléfono: no los recibimos, no los vendemos y no mostramos publicidad. Solo los análisis con IA que solicitas y la búsqueda por código de barras usan internet.</p>'],
 ['Quiénes somos', '<p>Kal-Track es publicada por Kal-Apps, desarrollador independiente. Contacto: <a href="mailto:{c}">{c}</a></p>'],
 ['Datos guardados en tu teléfono', '<ul><li>Perfil: nombre (opcional), sexo, edad, estatura, peso, nivel de actividad y objetivos.</li><li>Diario: comidas, cantidades, valores nutricionales, miniaturas de fotos, agua, pesajes.</li><li>Ajustes: idioma, unidades, tema.</li></ul><p>Estos datos se guardan en el almacenamiento privado de la aplicación (o del navegador en la versión web). Nunca se envían a nuestros servidores. Puedes exportarlos, importarlos o eliminarlos todos en Ajustes → Datos. Desinstalar la aplicación los borra.</p>'],
 ['Análisis con inteligencia artificial', '<p>Solo cuando solicitas un análisis (foto de una comida, etiqueta o descripción):</p><ul><li>la foto reducida o el texto se envía a nuestro relé seguro (alojado en Cloudflare), que lo transmite a la API Google Gemini para obtener la estimación nutricional;</li><li>nuestro relé no conserva fotos ni textos: solo cuenta el número de análisis por día para aplicar los límites de uso;</li><li>Google trata este contenido según las condiciones de pago de la API Gemini: no se usa para entrenar sus modelos y se conserva brevemente, solo para detectar abusos;</li><li>tu perfil (edad, peso…) nunca se envía.</li></ul><p>Consejo: fotografía solo tu plato o el envase, sin caras ni documentos personales.</p>'],
 ['Identificador anónimo del dispositivo', '<p>Para repartir de forma justa los análisis gratuitos, la aplicación crea un número aleatorio sin relación con tu identidad, tu cuenta de Google o tu teléfono. Se envía con cada análisis para contar los análisis del día. Estos contadores se eliminan al cabo de unos días. El número cambia si borras los datos de la aplicación.</p>'],
 ['Código de barras', '<p>El número del código de barras escaneado se envía a Open Food Facts (base de datos alimentaria abierta, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) para encontrar el producto. No se envía ningún otro dato.</p>'],
 ['Health Connect', '<p>Solo si lo activas en la aplicación Android, Kal-Track lee de Health Connect: el número de pasos, las sesiones de deporte (tipo, duración), las calorías activas quemadas y el peso medido por una báscula conectada. Estos datos solo se leen (nunca se modifican), se quedan en tu teléfono y solo sirven para mostrar tu actividad, ajustar tu objetivo calórico del día y completar tu curva de peso. Nunca se envían a nuestros servidores, a la IA ni a terceros, y no se usan para publicidad. Puedes retirar el acceso en cualquier momento en los ajustes de Health Connect.</p>'],
 ['Cámara', '<p>La cámara solo se usa cuando haces una foto o escaneas un código de barras o una etiqueta. Solo se conserva una miniatura de la comida, en tu teléfono.</p>'],
 ['Lo que no hacemos', '<ul><li>Sin cuenta ni registro.</li><li>Sin publicidad.</li><li>Sin estadísticas de uso, rastreadores ni cookies publicitarias.</li><li>Sin ubicación.</li><li>Ninguna venta ni cesión de tus datos con fines comerciales.</li></ul>'],
 ['Proveedores', '<ul><li>Cloudflare, Inc. – relé de los análisis con IA.</li><li>Google LLC – API Gemini (inteligencia artificial).</li><li>Open Food Facts – información de productos.</li><li>GitHub (Microsoft) – descarga única de la fuente del PDF en japonés, coreano o chino (sin datos personales).</li></ul><p>Estos proveedores pueden tratar datos fuera de la Unión Europea (en particular en Estados Unidos), con las garantías previstas por el RGPD (cláusulas contractuales tipo o Data Privacy Framework).</p>'],
 ['Edad', '<p>Kal-Track está destinada a personas de 18 años o más.</p>'],
 ['Salud', '<p>Las estimaciones de calorías y nutrientes son orientativas y pueden contener errores. No sustituyen el consejo de un médico o dietista.</p>'],
 ['Tus derechos', '<p>Como tus datos están en tu teléfono, tienes el control total: consultarlos, exportarlos, modificarlos y eliminarlos desde la aplicación. Para cualquier pregunta sobre tus datos o para ejercer tus derechos (RGPD), escríbenos a <a href="mailto:{c}">{c}</a>. También puedes acudir a la autoridad de protección de datos de tu país.</p>'],
 ['Cambios', '<p>Esta política puede cambiar con la aplicación. La fecha de la última actualización aparece en la parte superior de la página.</p>'],
]},
pt: { name: 'Português', title: 'Política de privacidade', date: 'Última atualização: 20 de novembro de 2026', s: [
 ['Em resumo', '<p class="summary">O Kal-Track funciona sem conta. O seu perfil, refeições, fotos e pesagens ficam guardados apenas no seu telemóvel: não os recebemos, não os vendemos e não mostramos publicidade. Apenas as análises com IA que pede e a pesquisa por código de barras usam a internet.</p>'],
 ['Quem somos', '<p>O Kal-Track é publicado pela Kal-Apps, programador independente. Contacto: <a href="mailto:{c}">{c}</a></p>'],
 ['Dados guardados no seu telemóvel', '<ul><li>Perfil: nome (opcional), sexo, idade, altura, peso, nível de atividade e objetivos.</li><li>Diário: refeições, quantidades, valores nutricionais, miniaturas das fotos, água, pesagens.</li><li>Definições: idioma, unidades, tema.</li></ul><p>Estes dados são guardados no armazenamento privado da aplicação (ou do navegador na versão web). Nunca são enviados para os nossos servidores. Pode exportá-los, importá-los ou apagá-los todos em Definições → Dados. Desinstalar a aplicação apaga-os.</p>'],
 ['Análise por inteligência artificial', '<p>Apenas quando pede uma análise (foto de uma refeição, rótulo ou descrição):</p><ul><li>a foto reduzida ou o texto é enviado para o nosso retransmissor seguro (alojado na Cloudflare), que o transmite à API Google Gemini para obter a estimativa nutricional;</li><li>o nosso retransmissor não guarda fotos nem textos: apenas conta o número de análises por dia para aplicar os limites de utilização;</li><li>a Google trata este conteúdo segundo as condições pagas da API Gemini: não é usado para treinar os seus modelos e é guardado por pouco tempo, apenas para detetar abusos;</li><li>o seu perfil (idade, peso…) nunca é enviado.</li></ul><p>Dica: fotografe apenas o prato ou a embalagem, sem rostos nem documentos pessoais.</p>'],
 ['Identificador anónimo do dispositivo', '<p>Para repartir de forma justa as análises gratuitas, a aplicação cria um número aleatório sem ligação à sua identidade, à sua conta Google ou ao seu telemóvel. É enviado com cada análise para contar as análises do dia. Estes contadores são apagados ao fim de alguns dias. O número muda se apagar os dados da aplicação.</p>'],
 ['Código de barras', '<p>O número do código de barras lido é enviado para o Open Food Facts (base de dados alimentar aberta, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) para encontrar o produto. Nenhum outro dado é enviado.</p>'],
 ['Health Connect', '<p>Apenas se o ativar na aplicação Android, o Kal-Track lê do Health Connect: o número de passos, os treinos (tipo, duração), as calorias ativas queimadas e o peso medido por uma balança ligada. Estes dados são apenas lidos (nunca modificados), ficam no seu telemóvel e servem só para mostrar a sua atividade, ajustar o objetivo calórico do dia e completar a curva de peso. Nunca são enviados para os nossos servidores, para a IA ou para terceiros, e não são usados para publicidade. Pode retirar o acesso a qualquer momento nas definições do Health Connect.</p>'],
 ['Câmara', '<p>A câmara só é usada quando tira uma foto ou lê um código de barras ou um rótulo. Apenas uma miniatura da refeição é guardada, no seu telemóvel.</p>'],
 ['O que não fazemos', '<ul><li>Sem conta nem registo.</li><li>Sem publicidade.</li><li>Sem estatísticas de utilização, rastreadores ou cookies publicitários.</li><li>Sem localização.</li><li>Nenhuma venda ou partilha dos seus dados para fins comerciais.</li></ul>'],
 ['Prestadores de serviços', '<ul><li>Cloudflare, Inc. – retransmissor das análises com IA.</li><li>Google LLC – API Gemini (inteligência artificial).</li><li>Open Food Facts – informações sobre produtos.</li><li>GitHub (Microsoft) – download único da fonte do PDF em japonês, coreano ou chinês (sem dados pessoais).</li></ul><p>Estes prestadores podem tratar dados fora da União Europeia (nomeadamente nos Estados Unidos), com as garantias previstas pelo RGPD (cláusulas contratuais-tipo ou Data Privacy Framework).</p>'],
 ['Idade', '<p>O Kal-Track destina-se a pessoas com 18 anos ou mais.</p>'],
 ['Saúde', '<p>As estimativas de calorias e nutrientes são indicativas e podem conter erros. Não substituem o conselho de um médico ou nutricionista.</p>'],
 ['Os seus direitos', '<p>Como os seus dados estão no seu telemóvel, tem controlo total: consultar, exportar, modificar e apagar a partir da aplicação. Para qualquer questão sobre os seus dados ou para exercer os seus direitos (RGPD), escreva-nos para <a href="mailto:{c}">{c}</a>. Pode também contactar a autoridade de proteção de dados do seu país.</p>'],
 ['Alterações', '<p>Esta política pode mudar com a aplicação. A data da última atualização aparece no topo da página.</p>'],
]},
de: { name: 'Deutsch', title: 'Datenschutzerklärung', date: 'Zuletzt aktualisiert: 20. November 2026', s: [
 ['Kurz gesagt', '<p class="summary">Kal-Track funktioniert ohne Konto. Dein Profil, deine Mahlzeiten, Fotos und Wiegungen werden nur auf deinem Handy gespeichert: Wir erhalten sie nicht, verkaufen sie nicht und zeigen keine Werbung. Nur die von dir angeforderten KI-Analysen und die Barcode-Suche nutzen das Internet.</p>'],
 ['Wer wir sind', '<p>Kal-Track wird von Kal-Apps, einem unabhängigen Entwickler, herausgegeben. Kontakt: <a href="mailto:{c}">{c}</a></p>'],
 ['Auf deinem Handy gespeicherte Daten', '<ul><li>Profil: Vorname (optional), Geschlecht, Alter, Größe, Gewicht, Aktivitätsniveau und Ziele.</li><li>Tagebuch: Mahlzeiten, Mengen, Nährwerte, Foto-Miniaturen, Wasser, Wiegungen.</li><li>Einstellungen: Sprache, Einheiten, Design.</li></ul><p>Diese Daten werden im privaten Speicher der App (bzw. des Browsers bei der Web-Version) abgelegt. Sie werden nie an unsere Server gesendet. Du kannst sie unter Einstellungen → Daten exportieren, importieren oder vollständig löschen. Beim Deinstallieren der App werden sie gelöscht.</p>'],
 ['Analyse mit künstlicher Intelligenz', '<p>Nur wenn du eine Analyse anforderst (Foto einer Mahlzeit, Nährwerttabelle oder Beschreibung):</p><ul><li>das verkleinerte Foto oder der Text wird an unser sicheres Relais (bei Cloudflare gehostet) gesendet, das ihn an die Google-Gemini-API weiterleitet, um die Nährwertschätzung zu erhalten;</li><li>unser Relais speichert weder Fotos noch Texte: Es zählt nur die Anzahl der Analysen pro Tag, um Nutzungsgrenzen anzuwenden;</li><li>Google verarbeitet diese Inhalte gemäß den kostenpflichtigen Bedingungen der Gemini-API: Sie werden nicht zum Training der Modelle verwendet und nur kurz gespeichert, ausschließlich zur Missbrauchserkennung;</li><li>dein Profil (Alter, Gewicht …) wird nie gesendet.</li></ul><p>Tipp: Fotografiere nur deinen Teller oder die Verpackung, ohne Gesichter oder persönliche Dokumente.</p>'],
 ['Anonyme Gerätekennung', '<p>Um die kostenlosen Analysen fair zu verteilen, erzeugt die App eine Zufallszahl ohne Bezug zu deiner Identität, deinem Google-Konto oder deinem Handy. Sie wird mit jeder Analyse gesendet, um die Analysen des Tages zu zählen. Diese Zähler werden nach einigen Tagen gelöscht. Die Zahl ändert sich, wenn du die App-Daten löschst.</p>'],
 ['Barcodes', '<p>Die Nummer des gescannten Barcodes wird an Open Food Facts (offene Lebensmitteldatenbank, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) gesendet, um das Produkt zu finden. Es werden keine weiteren Daten übertragen.</p>'],
 ['Health Connect', '<p>Nur wenn du es in der Android-App aktivierst, liest Kal-Track aus Health Connect: Schrittzahl, Trainings (Art, Dauer), verbrannte aktive Kalorien und das von einer vernetzten Waage gemessene Gewicht. Diese Daten werden nur gelesen (nie verändert), bleiben auf deinem Handy und dienen nur dazu, deine Aktivität anzuzeigen, dein Kalorienziel des Tages anzupassen und deine Gewichtskurve zu ergänzen. Sie werden nie an unsere Server, an die KI oder an Dritte gesendet und nie für Werbung verwendet. Du kannst den Zugriff jederzeit in den Health-Connect-Einstellungen widerrufen.</p>'],
 ['Kamera', '<p>Die Kamera wird nur verwendet, wenn du ein Foto machst oder einen Barcode bzw. eine Nährwerttabelle scannst. Nur eine Miniatur der Mahlzeit wird auf deinem Handy gespeichert.</p>'],
 ['Was wir nicht tun', '<ul><li>Kein Konto, keine Registrierung.</li><li>Keine Werbung.</li><li>Keine Nutzungsstatistiken, Tracker oder Werbe-Cookies.</li><li>Keine Standortdaten.</li><li>Kein Verkauf und keine Weitergabe deiner Daten zu kommerziellen Zwecken.</li></ul>'],
 ['Dienstleister', '<ul><li>Cloudflare, Inc. – Relais für KI-Analysen.</li><li>Google LLC – Gemini-API (künstliche Intelligenz).</li><li>Open Food Facts – Produktinformationen.</li><li>GitHub (Microsoft) – einmaliger Download der PDF-Schrift für Japanisch, Koreanisch oder Chinesisch (keine personenbezogenen Daten).</li></ul><p>Diese Dienstleister können Daten außerhalb der Europäischen Union verarbeiten (insbesondere in den USA), mit den von der DSGVO vorgesehenen Garantien (Standardvertragsklauseln oder Data Privacy Framework).</p>'],
 ['Alter', '<p>Kal-Track richtet sich an Personen ab 18 Jahren.</p>'],
 ['Gesundheit', '<p>Die Schätzungen von Kalorien und Nährstoffen sind Richtwerte und können Fehler enthalten. Sie ersetzen nicht den Rat eines Arztes oder Ernährungsberaters.</p>'],
 ['Deine Rechte', '<p>Da deine Daten auf deinem Handy liegen, hast du die volle Kontrolle: ansehen, exportieren, ändern und löschen direkt in der App. Bei Fragen zu deinen Daten oder zur Ausübung deiner Rechte (DSGVO) schreib uns an <a href="mailto:{c}">{c}</a>. Du kannst dich auch an die Datenschutzbehörde deines Landes wenden.</p>'],
 ['Änderungen', '<p>Diese Erklärung kann sich mit der App weiterentwickeln. Das Datum der letzten Aktualisierung steht oben auf der Seite.</p>'],
]},
it: { name: 'Italiano', title: 'Informativa sulla privacy', date: 'Ultimo aggiornamento: 20 novembre 2026', s: [
 ['In breve', '<p class="summary">Kal-Track funziona senza account. Il tuo profilo, i pasti, le foto e le pesate restano salvati solo sul tuo telefono: non li riceviamo, non li vendiamo e non mostriamo pubblicità. Solo le analisi IA che richiedi e la ricerca tramite codice a barre usano internet.</p>'],
 ['Chi siamo', '<p>Kal-Track è pubblicata da Kal-Apps, sviluppatore indipendente. Contatto: <a href="mailto:{c}">{c}</a></p>'],
 ['Dati salvati sul tuo telefono', '<ul><li>Profilo: nome (facoltativo), sesso, età, altezza, peso, livello di attività e obiettivi.</li><li>Diario: pasti, quantità, valori nutrizionali, miniature delle foto, acqua, pesate.</li><li>Impostazioni: lingua, unità, tema.</li></ul><p>Questi dati sono salvati nello spazio privato dell’app (o del browser per la versione web). Non vengono mai inviati ai nostri server. Puoi esportarli, importarli o eliminarli tutti in Impostazioni → Dati. Disinstallare l’app li cancella.</p>'],
 ['Analisi con intelligenza artificiale', '<p>Solo quando richiedi un’analisi (foto di un pasto, etichetta o descrizione):</p><ul><li>la foto ridotta o il testo viene inviato al nostro relay sicuro (ospitato da Cloudflare), che lo trasmette all’API Google Gemini per ottenere la stima nutrizionale;</li><li>il nostro relay non conserva foto né testi: conta solo il numero di analisi al giorno per applicare i limiti di utilizzo;</li><li>Google tratta questi contenuti secondo le condizioni a pagamento dell’API Gemini: non vengono usati per addestrare i suoi modelli e sono conservati per breve tempo, solo per rilevare abusi;</li><li>il tuo profilo (età, peso…) non viene mai inviato.</li></ul><p>Consiglio: fotografa solo il piatto o la confezione, senza volti né documenti personali.</p>'],
 ['Identificatore anonimo del dispositivo', '<p>Per ripartire equamente le analisi gratuite, l’app crea un numero casuale senza legame con la tua identità, il tuo account Google o il tuo telefono. Viene inviato con ogni analisi per contare le analisi del giorno. Questi contatori vengono cancellati dopo alcuni giorni. Il numero cambia se cancelli i dati dell’app.</p>'],
 ['Codice a barre', '<p>Il numero del codice a barre scansionato viene inviato a Open Food Facts (banca dati alimentare aperta, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) per trovare il prodotto. Nessun altro dato viene trasmesso.</p>'],
 ['Health Connect', '<p>Solo se lo attivi nell’app Android, Kal-Track legge da Health Connect: numero di passi, allenamenti (tipo, durata), calorie attive bruciate e peso misurato da una bilancia connessa. Questi dati vengono solo letti (mai modificati), restano sul tuo telefono e servono solo a mostrare la tua attività, regolare l’obiettivo calorico del giorno e completare la curva del peso. Non vengono mai inviati ai nostri server, all’IA o a terzi e non sono usati per la pubblicità. Puoi revocare l’accesso in qualsiasi momento nelle impostazioni di Health Connect.</p>'],
 ['Fotocamera', '<p>La fotocamera viene usata solo quando scatti una foto o scansioni un codice a barre o un’etichetta. Viene conservata solo una miniatura del pasto, sul tuo telefono.</p>'],
 ['Cosa non facciamo', '<ul><li>Nessun account né registrazione.</li><li>Nessuna pubblicità.</li><li>Nessuna statistica d’uso, tracker o cookie pubblicitari.</li><li>Nessuna localizzazione.</li><li>Nessuna vendita o condivisione dei tuoi dati a fini commerciali.</li></ul>'],
 ['Fornitori', '<ul><li>Cloudflare, Inc. – relay delle analisi IA.</li><li>Google LLC – API Gemini (intelligenza artificiale).</li><li>Open Food Facts – informazioni sui prodotti.</li><li>GitHub (Microsoft) – download una tantum del font del PDF in giapponese, coreano o cinese (nessun dato personale).</li></ul><p>Questi fornitori possono trattare dati al di fuori dell’Unione europea (in particolare negli Stati Uniti), con le garanzie previste dal GDPR (clausole contrattuali tipo o Data Privacy Framework).</p>'],
 ['Età', '<p>Kal-Track è destinata a persone di almeno 18 anni.</p>'],
 ['Salute', '<p>Le stime di calorie e nutrienti sono indicative e possono contenere errori. Non sostituiscono il parere di un medico o di un dietista.</p>'],
 ['I tuoi diritti', '<p>Poiché i tuoi dati sono sul tuo telefono, ne hai il pieno controllo: consultarli, esportarli, modificarli ed eliminarli dall’app. Per qualsiasi domanda sui tuoi dati o per esercitare i tuoi diritti (GDPR), scrivici a <a href="mailto:{c}">{c}</a>. Puoi anche rivolgerti all’autorità per la protezione dei dati del tuo paese.</p>'],
 ['Modifiche', '<p>Questa informativa può cambiare con l’evoluzione dell’app. La data dell’ultimo aggiornamento è indicata in cima alla pagina.</p>'],
]},
ja: { name: '日本語', title: 'プライバシーポリシー', date: '最終更新日：2026年11月20日', s: [
 ['概要', '<p class="summary">Kal-Track はアカウントなしで使えます。プロフィール、食事、写真、体重記録はあなたの端末にのみ保存されます。私たちはそれらを受け取らず、販売せず、広告も表示しません。インターネットを使うのは、あなたが依頼した AI 分析とバーコード検索だけです。</p>'],
 ['運営者', '<p>Kal-Track は個人開発者 Kal-Apps が提供しています。お問い合わせ：<a href="mailto:{c}">{c}</a></p>'],
 ['端末に保存されるデータ', '<ul><li>プロフィール：名前（任意）、性別、年齢、身長、体重、活動レベル、目標。</li><li>記録：食事、量、栄養価、写真のサムネイル、水分、体重記録。</li><li>設定：言語、単位、テーマ。</li></ul><p>これらのデータはアプリ（Web 版ではブラウザ）の専用領域に保存され、私たちのサーバーに送信されることはありません。設定 → データ から、エクスポート、インポート、全削除ができます。アプリをアンインストールすると消去されます。</p>'],
 ['AI による分析', '<p>あなたが分析（食事の写真、栄養成分表示、説明）を依頼したときだけ：</p><ul><li>縮小した写真またはテキストが、私たちの安全な中継サーバー（Cloudflare がホスト）に送られ、栄養の推定を得るため Google Gemini API に転送されます。</li><li>中継サーバーは写真もテキストも保存しません。利用上限を適用するため、1日の分析回数だけを数えます。</li><li>Google はこれらの内容を Gemini API の有料版の規約に従って処理します。モデルの学習には使われず、不正利用の検出のためだけに短期間保存されます。</li><li>プロフィール（年齢、体重など）は送信されません。</li></ul><p>ヒント：お皿やパッケージだけを撮影し、顔や個人的な書類が写らないようにしてください。</p>'],
 ['匿名の端末識別子', '<p>無料の分析を公平に配分するため、アプリはあなたの身元、Google アカウント、端末とは無関係なランダムな番号を作成します。この番号は分析ごとに送られ、その日の分析回数を数えるために使われます。カウンターは数日後に削除されます。アプリのデータを消去すると番号は変わります。</p>'],
 ['バーコード', '<p>スキャンしたバーコードの番号は、商品を探すために Open Food Facts（オープンな食品データベース、<a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>）に送られます。それ以外のデータは送信されません。</p>'],
 ['ヘルスコネクト', '<p>Android アプリで有効にした場合に限り、Kal-Track はヘルスコネクトから、歩数、運動（種類、時間）、消費した活動カロリー、スマート体重計で測った体重を読み取ります。これらのデータは読み取りのみ（変更はしません）で、端末内に残り、活動の表示、その日のカロリー目標の調整、体重グラフの補完にのみ使われます。私たちのサーバー、AI、第三者に送られることはなく、広告にも使われません。アクセスはヘルスコネクトの設定でいつでも取り消せます。</p>'],
 ['カメラ', '<p>カメラは、写真を撮るとき、またはバーコードや栄養成分表示をスキャンするときだけ使われます。端末には食事のサムネイルだけが保存されます。</p>'],
 ['私たちがしないこと', '<ul><li>アカウントや登録は不要です。</li><li>広告はありません。</li><li>利用統計、トラッカー、広告用 Cookie はありません。</li><li>位置情報は使いません。</li><li>あなたのデータを商業目的で販売・共有することはありません。</li></ul>'],
 ['委託先', '<ul><li>Cloudflare, Inc. – AI 分析の中継。</li><li>Google LLC – Gemini API（人工知能）。</li><li>Open Food Facts – 商品情報。</li><li>GitHub（Microsoft）– 日本語・韓国語・中国語の PDF 用フォントの初回ダウンロード（個人データは送信されません）。</li></ul><p>これらの委託先は、欧州連合の域外（特に米国）でデータを処理する場合があり、GDPR が定める保護措置（標準契約条項またはデータプライバシーフレームワーク）が適用されます。</p>'],
 ['年齢', '<p>Kal-Track は18歳以上の方を対象としています。</p>'],
 ['健康', '<p>カロリーや栄養素の推定値は目安であり、誤りを含む場合があります。医師や管理栄養士の助言に代わるものではありません。</p>'],
 ['あなたの権利', '<p>データはあなたの端末にあるため、閲覧、エクスポート、修正、削除をすべてアプリから自分で管理できます。データに関するご質問や権利の行使（GDPR）については <a href="mailto:{c}">{c}</a> までご連絡ください。お住まいの国のデータ保護機関に相談することもできます。</p>'],
 ['変更', '<p>このポリシーはアプリの進化に合わせて変更されることがあります。最終更新日はページ上部に記載しています。</p>'],
]},
ko: { name: '한국어', title: '개인정보처리방침', date: '최종 업데이트: 2026년 11월 20일', s: [
 ['요약', '<p class="summary">Kal-Track은 계정 없이 사용할 수 있어요. 프로필, 식사, 사진, 체중 기록은 오직 휴대폰에만 저장돼요. 저희는 이를 받지도, 판매하지도 않으며 광고도 표시하지 않아요. 인터넷은 사용자가 요청한 AI 분석과 바코드 검색에만 사용돼요.</p>'],
 ['운영자', '<p>Kal-Track은 독립 개발자 Kal-Apps가 제공해요. 문의: <a href="mailto:{c}">{c}</a></p>'],
 ['휴대폰에 저장되는 데이터', '<ul><li>프로필: 이름(선택), 성별, 나이, 키, 체중, 활동 수준, 목표.</li><li>기록: 식사, 양, 영양 정보, 사진 썸네일, 물, 체중 기록.</li><li>설정: 언어, 단위, 테마.</li></ul><p>이 데이터는 앱(웹 버전은 브라우저)의 비공개 저장 공간에 보관되며, 저희 서버로 전송되지 않아요. 설정 → 데이터에서 내보내기, 가져오기, 전체 삭제를 할 수 있어요. 앱을 삭제하면 데이터도 지워져요.</p>'],
 ['인공지능 분석', '<p>사용자가 분석(식사 사진, 영양성분표, 설명)을 요청할 때만:</p><ul><li>축소된 사진이나 텍스트가 저희의 보안 중계 서버(Cloudflare 호스팅)로 전송되고, 영양 추정치를 얻기 위해 Google Gemini API로 전달돼요.</li><li>중계 서버는 사진이나 텍스트를 보관하지 않으며, 사용 한도를 적용하기 위해 하루 분석 횟수만 집계해요.</li><li>Google은 이 내용을 Gemini API 유료 약관에 따라 처리해요. 모델 학습에 사용되지 않으며, 남용 탐지를 위해서만 잠시 보관돼요.</li><li>프로필(나이, 체중 등)은 절대 전송되지 않아요.</li></ul><p>팁: 얼굴이나 개인 문서 없이 접시나 포장만 찍어 주세요.</p>'],
 ['익명 기기 식별자', '<p>무료 분석을 공정하게 나누기 위해, 앱은 사용자의 신원, Google 계정, 휴대폰과 연결되지 않은 임의의 번호를 만들어요. 이 번호는 분석할 때마다 함께 전송되어 그날의 분석 횟수를 세는 데 쓰여요. 이 집계는 며칠 후 삭제돼요. 앱 데이터를 지우면 번호가 바뀌어요.</p>'],
 ['바코드', '<p>스캔한 바코드 번호는 제품을 찾기 위해 Open Food Facts(공개 식품 데이터베이스, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>)로 전송돼요. 다른 데이터는 전송되지 않아요.</p>'],
 ['헬스 커넥트', '<p>Android 앱에서 직접 켠 경우에만, Kal-Track은 헬스 커넥트에서 걸음 수, 운동(종류, 시간), 소모한 활동 칼로리, 스마트 체중계로 측정한 체중을 읽어요. 이 데이터는 읽기만 하고(수정하지 않음) 휴대폰에 남으며, 활동 표시, 오늘의 칼로리 목표 조정, 체중 그래프 보완에만 사용돼요. 저희 서버, AI, 제3자에게 절대 전송되지 않으며 광고에도 쓰이지 않아요. 헬스 커넥트 설정에서 언제든 접근 권한을 철회할 수 있어요.</p>'],
 ['카메라', '<p>카메라는 사진을 찍거나 바코드 또는 영양성분표를 스캔할 때만 사용돼요. 휴대폰에는 식사 썸네일만 저장돼요.</p>'],
 ['저희가 하지 않는 것', '<ul><li>계정이나 가입이 없어요.</li><li>광고가 없어요.</li><li>사용 통계, 추적기, 광고 쿠키가 없어요.</li><li>위치 정보를 사용하지 않아요.</li><li>사용자의 데이터를 상업적 목적으로 판매하거나 공유하지 않아요.</li></ul>'],
 ['서비스 제공업체', '<ul><li>Cloudflare, Inc. – AI 분석 중계.</li><li>Google LLC – Gemini API(인공지능).</li><li>Open Food Facts – 제품 정보.</li><li>GitHub(Microsoft) – 일본어·한국어·중국어 PDF 글꼴의 최초 1회 다운로드(개인 데이터는 전송되지 않음).</li></ul><p>이 업체들은 유럽연합 밖(특히 미국)에서 데이터를 처리할 수 있으며, GDPR이 요구하는 보호 조치(표준 계약 조항 또는 데이터 프라이버시 프레임워크)가 적용돼요.</p>'],
 ['연령', '<p>Kal-Track은 만 18세 이상을 대상으로 해요.</p>'],
 ['건강', '<p>칼로리와 영양소 추정치는 참고용이며 오류가 있을 수 있어요. 의사나 영양사의 조언을 대신하지 않아요.</p>'],
 ['사용자의 권리', '<p>데이터가 휴대폰에 있으므로 조회, 내보내기, 수정, 삭제를 앱에서 직접 관리할 수 있어요. 데이터에 관한 문의나 권리 행사(GDPR)는 <a href="mailto:{c}">{c}</a>로 연락해 주세요. 거주 국가의 개인정보 보호 기관에 문의할 수도 있어요.</p>'],
 ['변경', '<p>이 방침은 앱의 발전에 따라 변경될 수 있어요. 최종 업데이트 날짜는 페이지 상단에 표시돼요.</p>'],
]},
zh: { name: '繁體中文', title: '隱私權政策', date: '最後更新：2026 年 11 月 20 日', s: [
 ['摘要', '<p class="summary">Kal-Track 不需要帳戶。你的個人資料、餐點、照片和體重紀錄只儲存在你的手機上：我們不會收到、不會販售，也不顯示任何廣告。只有你要求的 AI 分析和條碼查詢會使用網路。</p>'],
 ['關於我們', '<p>Kal-Track 由獨立開發者 Kal-Apps 發行。聯絡方式：<a href="mailto:{c}">{c}</a></p>'],
 ['儲存在手機上的資料', '<ul><li>個人資料：名字（選填）、性別、年齡、身高、體重、活動量和目標。</li><li>日誌：餐點、份量、營養數值、照片縮圖、喝水量、體重紀錄。</li><li>設定：語言、單位、主題。</li></ul><p>這些資料儲存在 App 的私人空間（網頁版則在瀏覽器中），絕不會傳送到我們的伺服器。你可以在「設定 → 資料」中匯出、匯入或全部刪除。解除安裝 App 即會清除資料。</p>'],
 ['人工智慧分析', '<p>只有在你要求分析時（餐點照片、營養標示或文字描述）：</p><ul><li>縮小後的照片或文字會傳送到我們的安全中繼伺服器（由 Cloudflare 託管），再轉送至 Google Gemini API 以取得營養估算；</li><li>我們的中繼伺服器不保存照片或文字，只計算每日分析次數以套用使用上限；</li><li>Google 依 Gemini API 付費條款處理這些內容：不會用於訓練模型，僅短暫保存以偵測濫用；</li><li>你的個人資料（年齡、體重等）絕不會被傳送。</li></ul><p>小提醒：只拍攝你的餐盤或包裝，不要拍到臉孔或個人文件。</p>'],
 ['匿名裝置識別碼', '<p>為了公平分配免費分析，App 會產生一組與你的身分、Google 帳戶或手機無關的隨機號碼。每次分析時會一併傳送，用來計算當天的分析次數。這些計數會在幾天後刪除。清除 App 資料後號碼會改變。</p>'],
 ['條碼', '<p>掃描的條碼號碼會傳送到 Open Food Facts（開放式食品資料庫，<a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>）以查詢產品。不會傳送其他任何資料。</p>'],
 ['Health Connect', '<p>僅在你於 Android App 中啟用時，Kal-Track 才會從 Health Connect 讀取：步數、運動（類型、時長）、消耗的活動熱量，以及智慧體重計測得的體重。這些資料僅供讀取（絕不修改），會留在你的手機上，只用於顯示你的活動、調整當天的熱量目標及補充體重圖表。它們絕不會傳送到我們的伺服器、AI 或任何第三方，也不會用於廣告。你可以隨時在 Health Connect 設定中撤銷存取權。</p>'],
 ['相機', '<p>只有在你拍照或掃描條碼、營養標示時才會使用相機。手機上只會保留餐點縮圖。</p>'],
 ['我們不做的事', '<ul><li>不需要帳戶或註冊。</li><li>沒有廣告。</li><li>沒有使用統計、追蹤器或廣告 Cookie。</li><li>不使用位置資訊。</li><li>不會為商業目的販售或分享你的資料。</li></ul>'],
 ['服務供應商', '<ul><li>Cloudflare, Inc. – AI 分析中繼。</li><li>Google LLC – Gemini API（人工智慧）。</li><li>Open Food Facts – 產品資訊。</li><li>GitHub（Microsoft）– 首次下載日文、韓文或中文 PDF 字型（不會傳送個人資料）。</li></ul><p>這些供應商可能在歐盟以外（特別是美國）處理資料，並適用 GDPR 要求的保護措施（標準契約條款或資料隱私框架）。</p>'],
 ['年齡', '<p>Kal-Track 適用於 18 歲以上的使用者。</p>'],
 ['健康', '<p>熱量和營養素的估算僅供參考，可能有誤差。不能取代醫師或營養師的建議。</p>'],
 ['你的權利', '<p>由於資料在你的手機上，你可以完全掌控：在 App 中查看、匯出、修改和刪除。若對你的資料有任何疑問或要行使權利（GDPR），請寫信至 <a href="mailto:{c}">{c}</a>。你也可以聯絡所在國家的資料保護機關。</p>'],
 ['變更', '<p>本政策可能隨 App 的發展而變更。最後更新日期顯示於頁面頂端。</p>'],
]},
id: { name: 'Bahasa Indonesia', title: 'Kebijakan Privasi', date: 'Terakhir diperbarui: 20 November 2026', s: [
 ['Ringkasnya', '<p class="summary">Kal-Track bekerja tanpa akun. Profil, makanan, foto, dan penimbanganmu hanya disimpan di ponselmu: kami tidak menerimanya, tidak menjualnya, dan tidak menampilkan iklan. Hanya analisis AI yang kamu minta dan pencarian barcode yang memakai internet.</p>'],
 ['Tentang kami', '<p>Kal-Track diterbitkan oleh Kal-Apps, pengembang independen. Kontak: <a href="mailto:{c}">{c}</a></p>'],
 ['Data yang disimpan di ponselmu', '<ul><li>Profil: nama depan (opsional), jenis kelamin, usia, tinggi, berat, tingkat aktivitas, dan tujuan.</li><li>Jurnal: makanan, jumlah, nilai gizi, gambar mini foto, air, penimbangan.</li><li>Pengaturan: bahasa, satuan, tema.</li></ul><p>Data ini disimpan di penyimpanan pribadi aplikasi (atau browser untuk versi web). Data tidak pernah dikirim ke server kami. Kamu bisa mengekspor, mengimpor, atau menghapus semuanya di Pengaturan → Data. Menghapus aplikasi akan menghapus data tersebut.</p>'],
 ['Analisis kecerdasan buatan', '<p>Hanya saat kamu meminta analisis (foto makanan, label gizi, atau deskripsi):</p><ul><li>foto yang diperkecil atau teks dikirim ke relai aman kami (dihosting oleh Cloudflare), yang meneruskannya ke Google Gemini API untuk mendapatkan perkiraan gizi;</li><li>relai kami tidak menyimpan foto maupun teks: relai hanya menghitung jumlah analisis per hari untuk menerapkan batas penggunaan;</li><li>Google memproses konten ini sesuai ketentuan berbayar Gemini API: tidak dipakai untuk melatih modelnya dan hanya disimpan sebentar untuk mendeteksi penyalahgunaan;</li><li>profilmu (usia, berat…) tidak pernah dikirim.</li></ul><p>Tips: foto hanya piring atau kemasannya, tanpa wajah atau dokumen pribadi.</p>'],
 ['Pengenal perangkat anonim', '<p>Untuk membagi analisis gratis secara adil, aplikasi membuat nomor acak yang tidak terkait dengan identitas, akun Google, atau ponselmu. Nomor ini dikirim bersama setiap analisis untuk menghitung analisis hari itu. Penghitung ini dihapus setelah beberapa hari. Nomornya berubah jika kamu menghapus data aplikasi.</p>'],
 ['Barcode', '<p>Nomor barcode yang dipindai dikirim ke Open Food Facts (basis data makanan terbuka, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) untuk menemukan produknya. Tidak ada data lain yang dikirim.</p>'],
 ['Health Connect', '<p>Hanya jika kamu mengaktifkannya di aplikasi Android, Kal-Track membaca dari Health Connect: jumlah langkah, sesi olahraga (jenis, durasi), kalori aktif yang terbakar, dan berat yang diukur timbangan pintar. Data ini hanya dibaca (tidak pernah diubah), tetap di ponselmu, dan hanya dipakai untuk menampilkan aktivitasmu, menyesuaikan target kalori hari itu, dan melengkapi grafik beratmu. Data ini tidak pernah dikirim ke server kami, ke AI, atau ke pihak ketiga, dan tidak dipakai untuk iklan. Kamu bisa mencabut akses kapan saja di pengaturan Health Connect.</p>'],
 ['Kamera', '<p>Kamera hanya dipakai saat kamu mengambil foto atau memindai barcode atau label. Hanya gambar mini makanan yang disimpan, di ponselmu.</p>'],
 ['Yang tidak kami lakukan', '<ul><li>Tanpa akun atau pendaftaran.</li><li>Tanpa iklan.</li><li>Tanpa statistik penggunaan, pelacak, atau cookie iklan.</li><li>Tanpa lokasi.</li><li>Tidak menjual atau membagikan datamu untuk tujuan komersial.</li></ul>'],
 ['Penyedia layanan', '<ul><li>Cloudflare, Inc. – relai analisis AI.</li><li>Google LLC – Gemini API (kecerdasan buatan).</li><li>Open Food Facts – informasi produk.</li><li>GitHub (Microsoft) – unduhan pertama font PDF bahasa Jepang, Korea, atau Mandarin (tanpa data pribadi).</li></ul><p>Penyedia ini dapat memproses data di luar Uni Eropa (terutama di Amerika Serikat), dengan perlindungan yang diwajibkan GDPR (klausul kontrak standar atau Data Privacy Framework).</p>'],
 ['Usia', '<p>Kal-Track ditujukan untuk orang berusia 18 tahun ke atas.</p>'],
 ['Kesehatan', '<p>Perkiraan kalori dan nutrisi bersifat indikatif dan bisa mengandung kesalahan. Perkiraan ini tidak menggantikan saran dokter atau ahli gizi.</p>'],
 ['Hak-hakmu', '<p>Karena datamu ada di ponselmu, kamu memegang kendali penuh: lihat, ekspor, ubah, dan hapus dari aplikasi. Untuk pertanyaan tentang datamu atau untuk menggunakan hakmu (GDPR), kirim email ke <a href="mailto:{c}">{c}</a>. Kamu juga bisa menghubungi otoritas perlindungan data di negaramu.</p>'],
 ['Perubahan', '<p>Kebijakan ini dapat berubah seiring perkembangan aplikasi. Tanggal pembaruan terakhir ditampilkan di bagian atas halaman.</p>'],
]},
tr: { name: 'Türkçe', title: 'Gizlilik Politikası', date: 'Son güncelleme: 20 Kasım 2026', s: [
 ['Kısaca', '<p class="summary">Kal-Track hesap olmadan çalışır. Profilin, öğünlerin, fotoğrafların ve tartımların yalnızca telefonunda saklanır: bunları almayız, satmayız ve reklam göstermeyiz. İnterneti yalnızca istediğin yapay zekâ analizleri ve barkod aramaları kullanır.</p>'],
 ['Biz kimiz', '<p>Kal-Track, bağımsız geliştirici Kal-Apps tarafından yayınlanır. İletişim: <a href="mailto:{c}">{c}</a></p>'],
 ['Telefonunda saklanan veriler', '<ul><li>Profil: ad (isteğe bağlı), cinsiyet, yaş, boy, kilo, aktivite düzeyi ve hedefler.</li><li>Günlük: öğünler, miktarlar, besin değerleri, fotoğraf küçük resimleri, su, tartımlar.</li><li>Ayarlar: dil, birimler, tema.</li></ul><p>Bu veriler uygulamanın (web sürümünde tarayıcının) özel alanında saklanır ve asla sunucularımıza gönderilmez. Ayarlar → Veriler bölümünden dışa aktarabilir, içe aktarabilir veya tamamını silebilirsin. Uygulamayı kaldırmak verileri siler.</p>'],
 ['Yapay zekâ analizi', '<p>Yalnızca bir analiz istediğinde (öğün fotoğrafı, besin etiketi veya açıklama):</p><ul><li>küçültülmüş fotoğraf veya metin, güvenli aktarıcımıza (Cloudflare üzerinde barındırılır) gönderilir; aktarıcı, besin tahminini almak için bunu Google Gemini API’ye iletir;</li><li>aktarıcımız fotoğrafları veya metinleri saklamaz: kullanım sınırlarını uygulamak için yalnızca günlük analiz sayısını sayar;</li><li>Google bu içerikleri ücretli Gemini API koşullarına göre işler: modellerini eğitmek için kullanılmaz ve yalnızca kötüye kullanımı tespit etmek için kısa süre saklanır;</li><li>profilin (yaş, kilo…) asla gönderilmez.</li></ul><p>İpucu: yalnızca tabağının veya ambalajın fotoğrafını çek; yüz veya kişisel belge olmasın.</p>'],
 ['Anonim cihaz kimliği', '<p>Ücretsiz analizleri adil şekilde paylaştırmak için uygulama; kimliğinle, Google hesabınla veya telefonunla bağlantısı olmayan rastgele bir numara oluşturur. Bu numara günün analizlerini saymak için her analizle birlikte gönderilir. Bu sayaçlar birkaç gün sonra silinir. Uygulama verilerini silersen numara değişir.</p>'],
 ['Barkodlar', '<p>Taranan barkod numarası, ürünü bulmak için Open Food Facts’e (açık gıda veritabanı, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>) gönderilir. Başka hiçbir veri gönderilmez.</p>'],
 ['Health Connect', '<p>Yalnızca Android uygulamasında etkinleştirirsen Kal-Track, Health Connect’ten şunları okur: adım sayısı, antrenmanlar (tür, süre), yakılan aktif kaloriler ve akıllı tartıyla ölçülen kilo. Bu veriler yalnızca okunur (asla değiştirilmez), telefonunda kalır ve yalnızca aktiviteni göstermek, günün kalori hedefini ayarlamak ve kilo grafiğini tamamlamak için kullanılır. Asla sunucularımıza, yapay zekâya veya üçüncü taraflara gönderilmez ve reklam için kullanılmaz. Erişimi istediğin zaman Health Connect ayarlarından kaldırabilirsin.</p>'],
 ['Kamera', '<p>Kamera yalnızca fotoğraf çektiğinde veya bir barkod ya da etiket taradığında kullanılır. Telefonunda yalnızca öğünün küçük bir resmi saklanır.</p>'],
 ['Yapmadıklarımız', '<ul><li>Hesap veya kayıt yok.</li><li>Reklam yok.</li><li>Kullanım istatistiği, izleyici veya reklam çerezi yok.</li><li>Konum yok.</li><li>Verilerin ticari amaçla satılmaz veya paylaşılmaz.</li></ul>'],
 ['Hizmet sağlayıcılar', '<ul><li>Cloudflare, Inc. – yapay zekâ analizi aktarıcısı.</li><li>Google LLC – Gemini API (yapay zekâ).</li><li>Open Food Facts – ürün bilgileri.</li><li>GitHub (Microsoft) – Japonca, Korece veya Çince PDF yazı tipinin ilk ve tek seferlik indirilmesi (kişisel veri gönderilmez).</li></ul><p>Bu sağlayıcılar verileri Avrupa Birliği dışında (özellikle ABD’de), GDPR’nin öngördüğü güvencelerle (standart sözleşme maddeleri veya Data Privacy Framework) işleyebilir.</p>'],
 ['Yaş', '<p>Kal-Track 18 yaş ve üzeri kişiler içindir.</p>'],
 ['Sağlık', '<p>Kalori ve besin tahminleri bilgi amaçlıdır ve hata içerebilir. Bir doktorun veya diyetisyenin tavsiyesinin yerini tutmaz.</p>'],
 ['Hakların', '<p>Verilerin telefonunda olduğu için kontrol tamamen sende: uygulamadan görüntüleyebilir, dışa aktarabilir, düzenleyebilir ve silebilirsin. Verilerinle ilgili sorular veya haklarını kullanmak için (GDPR/KVKK) <a href="mailto:{c}">{c}</a> adresine yaz. Ülkendeki veri koruma kurumuna da başvurabilirsin.</p>'],
 ['Değişiklikler', '<p>Bu politika uygulama geliştikçe değişebilir. Son güncelleme tarihi sayfanın üstünde yer alır.</p>'],
]},
ru: { name: 'Русский', title: 'Политика конфиденциальности', date: 'Последнее обновление: 20 ноября 2026 г.', s: [
 ['Коротко', '<p class="summary">Kal-Track работает без аккаунта. Твой профиль, блюда, фото и взвешивания хранятся только на твоём телефоне: мы их не получаем, не продаём и не показываем рекламу. Интернет используется только для ИИ-анализов, которые ты запрашиваешь, и для поиска по штрихкоду.</p>'],
 ['Кто мы', '<p>Kal-Track выпускает Kal-Apps, независимый разработчик. Контакт: <a href="mailto:{c}">{c}</a></p>'],
 ['Данные на твоём телефоне', '<ul><li>Профиль: имя (необязательно), пол, возраст, рост, вес, уровень активности и цели.</li><li>Дневник: блюда, количества, пищевая ценность, миниатюры фото, вода, взвешивания.</li><li>Настройки: язык, единицы, тема.</li></ul><p>Эти данные хранятся в закрытом хранилище приложения (или браузера для веб-версии). Они никогда не отправляются на наши серверы. Их можно экспортировать, импортировать или полностью удалить в разделе Настройки → Данные. При удалении приложения они стираются.</p>'],
 ['Анализ с помощью искусственного интеллекта', '<p>Только когда ты запрашиваешь анализ (фото блюда, этикетки или описание):</p><ul><li>уменьшенное фото или текст отправляется на наш защищённый ретранслятор (размещён в Cloudflare), который передаёт его в Google Gemini API для оценки пищевой ценности;</li><li>ретранслятор не хранит ни фото, ни тексты: он только считает число анализов в день, чтобы применять лимиты;</li><li>Google обрабатывает эти данные по условиям платного Gemini API: они не используются для обучения моделей и хранятся недолго, только для выявления злоупотреблений;</li><li>твой профиль (возраст, вес…) никогда не отправляется.</li></ul><p>Совет: фотографируй только тарелку или упаковку, без лиц и личных документов.</p>'],
 ['Анонимный идентификатор устройства', '<p>Чтобы честно распределять бесплатные анализы, приложение создаёт случайный номер, не связанный с твоей личностью, аккаунтом Google или телефоном. Он отправляется с каждым анализом, чтобы считать анализы за день. Эти счётчики удаляются через несколько дней. Номер меняется, если очистить данные приложения.</p>'],
 ['Штрихкоды', '<p>Номер отсканированного штрихкода отправляется в Open Food Facts (открытая база продуктов, <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>), чтобы найти продукт. Никакие другие данные не передаются.</p>'],
 ['Health Connect', '<p>Только если ты включишь это в Android-приложении, Kal-Track читает из Health Connect: число шагов, тренировки (тип, длительность), сожжённые активные калории и вес с умных весов. Эти данные только читаются (никогда не изменяются), остаются на телефоне и используются лишь для показа активности, корректировки цели по калориям на день и дополнения графика веса. Они никогда не отправляются на наши серверы, в ИИ или третьим лицам и не используются для рекламы. Доступ можно отозвать в любой момент в настройках Health Connect.</p>'],
 ['Камера', '<p>Камера используется только когда ты делаешь фото или сканируешь штрихкод либо этикетку. На телефоне сохраняется только миниатюра блюда.</p>'],
 ['Чего мы не делаем', '<ul><li>Никаких аккаунтов и регистрации.</li><li>Никакой рекламы.</li><li>Никакой статистики использования, трекеров и рекламных cookie.</li><li>Никакой геолокации.</li><li>Никакой продажи или передачи твоих данных в коммерческих целях.</li></ul>'],
 ['Поставщики услуг', '<ul><li>Cloudflare, Inc. — ретранслятор ИИ-анализов.</li><li>Google LLC — Gemini API (искусственный интеллект).</li><li>Open Food Facts — информация о продуктах.</li><li>GitHub (Microsoft) — однократная загрузка шрифта для PDF на японском, корейском или китайском (личные данные не передаются).</li></ul><p>Эти поставщики могут обрабатывать данные за пределами Европейского союза (в частности, в США) с гарантиями, предусмотренными GDPR (стандартные договорные условия или Data Privacy Framework).</p>'],
 ['Возраст', '<p>Kal-Track предназначено для лиц от 18 лет.</p>'],
 ['Здоровье', '<p>Оценки калорий и нутриентов носят ориентировочный характер и могут содержать ошибки. Они не заменяют консультацию врача или диетолога.</p>'],
 ['Твои права', '<p>Поскольку данные находятся на твоём телефоне, ты полностью их контролируешь: просмотр, экспорт, изменение и удаление прямо в приложении. По вопросам о данных или для осуществления своих прав (GDPR) пиши на <a href="mailto:{c}">{c}</a>. Также можно обратиться в орган по защите данных своей страны.</p>'],
 ['Изменения', '<p>Эта политика может меняться вместе с приложением. Дата последнего обновления указана вверху страницы.</p>'],
]},
};

function pick() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && L[q]) return q;
  for (const l of navigator.languages || [navigator.language || 'fr']) { let k = String(l).slice(0, 2).toLowerCase(); if (k === 'in') k = 'id'; if (L[k]) return k; }
  return 'en';
}
function render(k) {
  const d = L[k];
  document.documentElement.lang = k;
  document.title = 'Kal-Track – ' + d.title;
  document.getElementById('title').textContent = 'Kal-Track – ' + d.title;
  document.getElementById('date').textContent = d.date;
  document.getElementById('content').innerHTML = d.s.map(([h, b]) => '<h2>' + h + '</h2>' + b.split('{c}').join(CONTACT)).join('');
  document.querySelectorAll('#langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
}
document.getElementById('langs').innerHTML = Object.keys(L).map((k) => '<button type="button" data-k="' + k + '">' + L[k].name + '</button>').join('');
document.getElementById('langs').addEventListener('click', (e) => { const k = e.target.dataset && e.target.dataset.k; if (k) { history.replaceState(null, '', '?lang=' + k); render(k); } });
render(pick());
</script>
</body>
</html>
